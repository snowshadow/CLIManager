name: Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag_name="${GITHUB_REF_NAME}"
            release_name="${GITHUB_REF_NAME}"
            prerelease="false"
            make_latest="true"
          else
            version="main-latest"
            tag_name="main-latest"
            release_name="main-latest (${GITHUB_SHA::7})"
            prerelease="true"
            make_latest="false"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${make_latest}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: VERSION=${{ steps.meta.outputs.version }} scripts/build_dmg.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          target_commitish: ${{ github.sha }}
          files: dist/CLIManagerApp-v${{ steps.meta.outputs.version }}.dmg
          overwrite_files: true
